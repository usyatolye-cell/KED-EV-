<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kedi Evi</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
html,body{height:100%;margin:0;background:#f5f1ea}
model-viewer{width:100%;height:100dvh;--poster-color:transparent}
#ar-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 24px;font-size:17px;border:0;border-radius:24px;background:rgba(181,56,42,.92);color:#fff;font-family:sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3)}
</style>
</head>
<body>
<model-viewer src="kedi_evi.glb" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed"
  camera-controls auto-rotate camera-orbit="30deg 75deg 1.8m" field-of-view="30deg"
  exposure="1.2" shadow-intensity="1">
  <button slot="ar-button" id="ar-btn">Evinde gör 🐱</button>
</model-viewer>
</body>
</html>
